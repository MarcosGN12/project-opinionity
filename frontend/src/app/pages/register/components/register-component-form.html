<div class="flex items-center justify-center min-h-screen bg-slate-50 p-4">
  <div
    class="w-full max-w-lg bg-white p-8 shadow-xl rounded-2xl border-t-4 border-blue-600 transition-all"
  >
    <header class="flex flex-col items-center text-center mb-6">
      <div
        class="w-12 h-12 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mb-3 shadow-inner"
      >
        <i-lucide name="UserPlus" [size]="24"></i-lucide>
      </div>
      <h1 class="font-extrabold text-2xl text-slate-800">Create Account</h1>
      <p class="text-slate-500 text-sm mt-1 font-medium">Improve your lifestyle today</p>
    </header>

    <form [formGroup]="registerForm" (ngSubmit)="onregister()" class="space-y-4">
      <div class="flex flex-col gap-1">
        <label for="email" class="text-xs font-bold uppercase tracking-wider text-slate-600"
          >Email</label
        >
        <div class="relative flex items-center">
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="name@example.com"
            class="w-full bg-slate-50 text-slate-800 text-sm rounded-xl px-3.5 py-2.5 border border-slate-200 outline-none focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all placeholder:text-slate-400"
          />
        </div>
      </div>

      <div class="flex flex-col gap-1">
        <label for="password" class="text-xs font-bold uppercase tracking-wider text-slate-600"
          >Password</label
        >
        <div class="relative flex items-center">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="••••••••"
            class="w-full bg-slate-50 text-slate-800 text-sm rounded-xl pl-3.5 pr-10 py-2.5 border border-slate-200 outline-none focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all placeholder:text-slate-400"
          />
          <button
            type="button"
            (click)="togglePasswordVisibility()"
            class="absolute right-3 text-slate-400 hover:text-slate-600 cursor-pointer focus:outline-none transition-colors"
          >
            <i-lucide [name]="showPassword ? 'EyeOff' : 'Eye'" [size]="18"></i-lucide>
          </button>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="flex flex-col gap-1">
          <label for="username" class="text-xs font-bold uppercase tracking-wider text-slate-600"
            >Username</label
          >
          <input
            id="username"
            type="text"
            formControlName="username"
            placeholder="johndoe"
            class="w-full bg-slate-50 text-slate-800 text-sm rounded-xl px-3.5 py-2.5 border border-slate-200 outline-none focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all placeholder:text-slate-400"
          />
        </div>

        <div class="flex flex-col gap-1">
          <label for="displayName" class="text-xs font-bold uppercase tracking-wider text-slate-600"
            >Display Name</label
          >
          <input
            id="displayName"
            type="text"
            formControlName="displayName"
            placeholder="John Doe"
            class="w-full bg-slate-50 text-slate-800 text-sm rounded-xl px-3.5 py-2.5 border border-slate-200 outline-none focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all placeholder:text-slate-400"
          />
        </div>

        <div class="flex flex-col gap-1">
          <label for="gender" class="text-xs font-bold uppercase tracking-wider text-slate-600"
            >Gender</label
          >
          <div class="relative flex items-center">
            <select
              id="gender"
              formControlName="gender"
              class="w-full bg-slate-50 text-slate-800 text-sm border border-slate-200 rounded-xl pl-3.5 pr-8 py-2.5 outline-none focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all appearance-none cursor-pointer"
            >
              <option value="" disabled selected hidden>Select gender</option>
              <option value="male">Man</option>
              <option value="female">Woman</option>
              <option value="prefer_not_to_say">Prefer not to say</option>
              <option value="other">Other</option>
            </select>
            <div class="pointer-events-none absolute right-3 text-slate-400">
              <i-lucide name="ChevronDown" [size]="16"></i-lucide>
            </div>
          </div>
        </div>

        <div class="flex flex-col gap-1">
          <label for="location" class="text-xs font-bold uppercase tracking-wider text-slate-600"
            >Location</label
          >
          <input
            id="location"
            type="text"
            formControlName="location"
            placeholder="City, Country"
            class="w-full bg-slate-50 text-slate-800 text-sm rounded-xl px-3.5 py-2.5 border border-slate-200 outline-none focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all placeholder:text-slate-400"
          />
        </div>
      </div>

      <div class="flex flex-col gap-1">
        <label for="birthDate" class="text-xs font-bold uppercase tracking-wider text-slate-600"
          >Date of Birth</label
        >
        <input
          id="birthDate"
          type="date"
          formControlName="birthDate"
          class="w-full bg-slate-50 text-slate-800 text-sm rounded-xl px-3.5 py-2.5 border border-slate-200 outline-none focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all cursor-pointer"
        />
      </div>

      <button
        type="submit"
        class="w-full mt-2 py-3 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold rounded-xl shadow-lg shadow-blue-500/30 transition-all cursor-pointer text-sm"
      >
        Register
      </button>
    </form>

    <div class="relative flex items-center my-6">
      <div class="grow border-t border-slate-200"></div>
      <span class="shrink mx-3 text-xs font-bold text-slate-400 uppercase">OR</span>
      <div class="grow border-t border-slate-200"></div>
    </div>

    <div class="text-center text-sm">
      <p class="text-slate-500">
        Already have an account?
        <a href="/login" class="text-blue-600 font-bold hover:underline ml-1">Sign in</a>
      </p>
    </div>
  </div>
</div>
